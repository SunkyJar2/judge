services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-untitled_judge}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-judge0_redis_secret}@redis:6379
      - JUDGE0_URL=http://judge0-server:2358
      - JUDGE0_TOKEN=${JUDGE0_TOKEN:-judge0_secret_token_123}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-judge0_webhook_secret_hmac_32_chars_long_key}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${PUBLIC_ORIGIN:-http://localhost}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - STORAGE_DIR=/app/storage
    volumes:
      - cas-storage:/app/storage
    depends_on:
      - db
      - redis
      - judge0-server

  db:
    image: postgres:16.2
    restart: always
    env_file: judge0.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-untitled_judge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7.2.4
    restart: always
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: always
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      - db
      - redis

  judge0-workers:
    image: judge0/judge0:1.13.1
    restart: always
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - db
      - redis

volumes:
  postgres-data:
  redis-data:
  cas-storage:
  caddy-data:
  caddy-config:

